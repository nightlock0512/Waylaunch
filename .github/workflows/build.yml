name: Build

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            dpkg-dev \
            libfreetype-dev \
            libpng-dev \
            libwayland-dev \
            libxkbcommon-dev

      - name: Build
        run: make clean all

      - name: Build Debian package
        run: make deb

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: waylaunch-${{ runner.arch }}
          path: |
            waylaunch
            *.deb
          if-no-files-found: error